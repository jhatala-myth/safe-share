# ---------- rate limiting (per client IP) ----------
limit_req_zone $binary_remote_addr zone=ss_create:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=ss_secret:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=ss_general:10m rate=120r/m;
limit_req_status 429;
limit_req_log_level info;   # rejected requests are visible as 429 in the (redacted) access log
limit_conn_zone $binary_remote_addr zone=ss_conn:10m;

upstream safeshare_app {
    server app:8000;
    keepalive 16;
}

# ---------- HTTP -> HTTPS ----------
server {
    listen 8080 default_server;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;          # set to your FQDN, e.g. share.example.com

    # Your existing certificate (full chain) and private key, mounted from ./certs
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Mozilla "intermediate" profile
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (only on HTTPS). Add "; includeSubDomains" only if ALL subdomains are HTTPS.
    add_header Strict-Transport-Security "max-age=63072000" always;
    # Other security headers (CSP, Referrer-Policy, no-store, ...) are set by the app.

    client_max_body_size 16k;
    limit_conn ss_conn 20;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_buffering off;    # don't spool secrets to temp files

    # Only methods the app uses
    if ($request_method !~ ^(GET|HEAD|POST|DELETE)$) { return 405; }

    # Create page + create API: optionally restricted (see snippets/create-access.conf)
    location = / {
        include /etc/nginx/snippets/create-access.conf;
        limit_req zone=ss_general burst=20 nodelay;
        proxy_pass http://safeshare_app;
    }
    location = /api/v1/secrets {
        include /etc/nginx/snippets/create-access.conf;
        client_max_body_size 3m;
        limit_req zone=ss_create burst=5 nodelay;
        proxy_pass http://safeshare_app;
    }

    # Status / reveal / revoke
    location ^~ /api/v1/secrets/ {
        limit_req zone=ss_secret burst=10 nodelay;
        proxy_pass http://safeshare_app;
    }

    # Recipient page and static assets
    location ^~ /s/ {
        limit_req zone=ss_general burst=20 nodelay;
        proxy_pass http://safeshare_app;
    }
    # Static assets: small, public, no rate limit (one page view = ~8 requests; NAT-ed offices)
    location ^~ /static/ {
        proxy_pass http://safeshare_app;
    }

    location = /favicon.ico {
        proxy_pass http://safeshare_app;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Health endpoint is internal only (Docker healthcheck hits the app directly)
    location / {
        return 404;
    }
}
