# Who may CREATE secrets (the "/" page and POST /api/v1/secrets).
# Recipients (/s/...) are never restricted here – they only need the link.
#
# Default: open to everyone. Recommended: restrict to the corporate network/VPN
# and/or require a login. Uncomment what you need.

# --- Option A: IP allowlist (office / VPN ranges) ---
# allow 10.0.0.0/8;
# allow 192.168.0.0/16;
# allow 203.0.113.10;
# deny  all;

# --- Option B: HTTP Basic auth (create htpasswd: htpasswd -B -c nginx/htpasswd user) ---
# auth_basic           "Safe Share";
# auth_basic_user_file /etc/nginx/htpasswd;

# --- Option C (later): SSO via oauth2-proxy + auth_request (OIDC: Entra ID, Keycloak, Google) ---
