# nginx for nginx-unprivileged image (runs as uid 101, read-only root FS)
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;

    # Hardening: small buffers & timeouts (slowloris)
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          15s;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    # ---------- log redaction: secret IDs never reach logs ----------
    map $request_uri $redacted_uri {
        ~^/s/                                    "/s/[redacted]";
        ~^/api/v1/secrets/[^/?]+/reveal          "/api/v1/secrets/[redacted]/reveal";
        ~^/api/v1/secrets/[^/?]+                 "/api/v1/secrets/[redacted]";
        default                                  $request_uri;
    }
    log_format redacted '$remote_addr [$time_iso8601] "$request_method $redacted_uri $server_protocol" '
                        '$status $body_bytes_sent rt=$request_time "$http_user_agent"';
    access_log /dev/stdout redacted;

    include /etc/nginx/conf.d/*.conf;
}
