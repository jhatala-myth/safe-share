name: safe-share

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:stable-alpine   # pin by digest in production
    ports:
      - "${HTTPS_PORT:-443}:8443"
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
    tmpfs:
      - /tmp:size=32m
    depends_on:
      app:
        condition: service_healthy
    networks: [edge, frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1:8443/robots.txt || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  app:
    <<: *hardening
    build: ./app
    image: safe-share-app:latest
    environment:
      REDIS_URL: "redis://default:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0"
      TTL_OPTIONS: "${TTL_OPTIONS:-300,3600,86400,259200,604800}"
      DEFAULT_TTL: "${DEFAULT_TTL:-86400}"
      MAX_PLAINTEXT_BYTES: "${MAX_PLAINTEXT_BYTES:-1048576}"
    tmpfs:
      - /tmp:size=16m
    depends_on:
      redis:
        condition: service_healthy
    networks: [frontend, backend]

  redis:
    <<: *hardening
    image: redis:7.4-alpine            # or valkey/valkey:8-alpine
    user: "999:1000"
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      - --save
      - ""                             # no RDB snapshots: secrets never hit disk
      - --appendonly
      - "no"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-256mb}"
      - --maxmemory-policy
      - noeviction                     # never silently drop secrets; reject new ones instead
      - --protected-mode
      - "yes"
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD}"
    tmpfs:
      - /data:size=8m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

networks:
  edge: {}                 # published ports (internet-facing)
  frontend:
    internal: true         # nginx <-> app, no egress
  backend:
    internal: true         # app <-> redis, no egress
